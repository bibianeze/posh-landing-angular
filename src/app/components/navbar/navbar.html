<!-- HEADER Section -->
<header class="header">
  <nav class="nav">
    <a href="#" class="logo">
      <img src="https://prium.github.io/Posh/v2.1.0/assets/images/posh-logo.png" alt="Posh logo" />
    </a>
    <button
      class="nav-toggle"
      id="navToggle"
      aria-label="Toggle menu"
      (click)="toggleMenu()"
      [class.active]="menuOpen"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

   <ul class="nav-links" id="navLinks" [class.open]="menuOpen">
  @for (link of navLinks; track link.label) {
    <li><a routerLink="{{ link.path }}">{{ link.label }} <span class="caret"></span></a></li>
  }
</ul>
  </nav>
</header>
