
   <!-- HERO Section -->
  <section class="hero">
  <p class="eyebrow">{{ eyebrow() }}</p>
  <h1 class="hero-title">Create <span class="accent">{{ headline() }}</span> websites</h1>
  <p class="hero-subtitle">{{ subtext() }}</p>

  <div class="hero-cta">
    <button class="btn btn-primary" (click)="onExploreClick()">Explore demos</button>
    <p class="hero-link">or <a href="#">Purchase POSH <span class="arrow">&rarr;</span></a></p>
  </div>

  <div class="showcase-image-wrap">
    <img
      class="showcase-image"
      src="https://prium.github.io/Posh/v2.1.0/assets/images/showcase-01.jpg"
      alt="Posh demo devices showing The Details, About Posh, and a portfolio profile page"
    />
  </div>
</section>
